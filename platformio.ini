; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
; Arduino-ESP32 3.x (ESP_I2S + rgbLedWrite); official PIO platform stays on 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; BENCH ONLY - remove once the I2C peripherals and MAX98357A are wired.
    ; Lets boot continue past a missing PCA9685 / failed I2S so Wi-Fi and the
    ; web UI come up. Servo commands then silently do nothing and /test/servo
    ; still reports {"ok":true}.
    -D ALLOW_MISSING_HARDWARE

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

extra_scripts =
    pre:scripts/copy_assets.py
    post:scripts/upload_fs_after_upload.py

; Host Unity tests — never flash. Run: pio test -e native
test_ignore = *

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<**/*.*>
    +<settings/validate.cpp>
build_flags = -std=c++17 -Iinclude